name: LiveTrans
options:
  bundleIdPrefix: kr.manuel71
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 앱 버전은 0.1.<빌드 번호>. 빌드 번호는 릴리스 훅(scripts/hooks/pre-push)이 커밋 수로 넘긴다.
    CURRENT_PROJECT_VERSION: "0"
    MARKETING_VERSION: "0.1.$(CURRENT_PROJECT_VERSION)"
packages:
  # Package.resolved가 커밋되지 않으므로(*.xcodeproj 무시) 버전을 고정한다. 매크로 신뢰도 이 버전에 걸린다.
  AnyLanguageModel:
    url: https://github.com/huggingface/AnyLanguageModel
    exactVersion: 1.3.0
  # 자동 업데이트. 릴리스 훅이 이 패키지에 든 sign_update로 서명하므로 버전을 고정한다.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  LiveTrans:
    type: application
    platform: macOS
    sources: [LiveTrans]
    dependencies:
      - package: AnyLanguageModel
      - package: Sparkle
    info:
      path: LiveTrans/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 말한 내용을 전사하고 번역하기 위해 마이크를 사용합니다.
        NSLocalNetworkUsageDescription: 같은 네트워크의 LLM 서버로 후보정 요청을 보내기 위해 로컬 네트워크를 사용합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SUFeedURL: https://github.com/manuel71sj/live-trans/releases/latest/download/appcast.xml
        # 릴리스 훅이 같은 계정(live-trans)의 개인 키로 zip에 서명한다. 짝이 아니면 훅이 중단된다.
        SUPublicEDKey: sXgTdXCmRJj9JmGKI3DYlxMGxc/R6+tTjdYWd8BIScE=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
    entitlements:
      path: LiveTrans/LiveTrans.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        # Sparkle 설치기(XPC)와 통신하기 위한 샌드박스 예외
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.manuel71.LiveTrans
        CODE_SIGN_IDENTITY: "-"
  # 같은 소스로 만드는 iOS 판. 자동 업데이트(Sparkle)와 샌드박스 entitlements는 macOS 전용이다.
  LiveTrans-iOS:
    type: application
    platform: iOS
    sources:
      - path: LiveTrans
        excludes: [Info.plist]
    dependencies:
      - package: AnyLanguageModel
    info:
      path: LiveTrans-iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 말한 내용을 전사하고 번역하기 위해 마이크를 사용합니다.
        NSLocalNetworkUsageDescription: 같은 네트워크의 LLM 서버로 후보정 요청을 보내기 위해 로컬 네트워크를 사용합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 화면이 잠기거나 다른 앱으로 가도 마이크 입력을 이어 받는다.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_NAME: LiveTrans
        PRODUCT_BUNDLE_IDENTIFIER: kr.manuel71.LiveTrans
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: NM989YJ9T8
        CODE_SIGN_STYLE: Automatic
