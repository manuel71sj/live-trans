name: LiveTrans
options:
  bundleIdPrefix: kr.manuel71
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 앱 버전은 0.1.<빌드 번호>. 빌드 번호는 릴리스 훅(scripts/hooks/pre-push)이 커밋 수로 넘긴다.
    CURRENT_PROJECT_VERSION: "0"
    MARKETING_VERSION: "0.1.$(CURRENT_PROJECT_VERSION)"
packages:
  # Package.resolved가 커밋되지 않으므로(*.xcodeproj 무시) 버전을 고정한다. 매크로 신뢰도 이 버전에 걸린다.
  AnyLanguageModel:
    url: https://github.com/huggingface/AnyLanguageModel
    exactVersion: 1.3.0
targets:
  LiveTrans:
    type: application
    platform: macOS
    sources: [LiveTrans]
    dependencies:
      - package: AnyLanguageModel
    info:
      path: LiveTrans/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 말한 내용을 전사하고 번역하기 위해 마이크를 사용합니다.
        NSLocalNetworkUsageDescription: 같은 네트워크의 LLM 서버로 후보정 요청을 보내기 위해 로컬 네트워크를 사용합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: LiveTrans/LiveTrans.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.manuel71.LiveTrans
        CODE_SIGN_IDENTITY: "-"
